ze:11px;overflow-wrap:anywhere;padding:5px;text-align:center}.app .icon{width:54px;height:54px}.home{background:radial-gradient(ellipse at 18% 45%,#857c6b55,transparent 48%),linear-gradient(135deg,#292b30,#101115 70%);padding:20px;display:flex;flex-direction:column;min-height:100%}.widget{border:1px solid #ffffff22;background:#10121677;padding:14px;border-radius:20px;backdrop-filter:blur(8px);line-height:1.8}.green{color:#9de5c8}.days{display:flex;justify-content:space-between;gap:5px;text-align:center;margin-top:12px}.days b{display:block;font-size:18px}.folders{margin:20px 0 20px auto;width:110px;display:grid;gap:10px}.dock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#ffffff13;border-radius:24px;padding:8px;gap:2px}.wallnote{margin-top:auto;color:#b9b3aa;font-size:11px;max-width:180px;line-height:1.6}.lock{background:#000;text-align:center;min-height:100%;padding:65px 20px 20px}.clock{font-size:68px;font-weight:200;letter-spacing:-4px}.pin{background:#151515;border:1px solid #444;border-radius:12px;color:white;font-size:24px;text-align:center;width:160px;padding:12px;margin:25px auto 10px;display:block}.pill{background:#30394b;border-radius:24px;padding:10px 20px}.bubble{max-width:86%;width:fit-content;padding:12px 15px;background:#282d36;border-radius:18px;margin:8px 0;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:#344967}.sender{font-size:11px;color:#aab5c9;margin-top:14px}.thumb{height:120px;border-radius:14px;background:linear-gradient(135deg,#3c414b,#15171b);display:grid;place-items:center;font-size:30px;pointer-events:none}.photo{width:100%;text-align:left;padding:8px}.nav{display:flex;justify-content:space-around;background:#090a0c;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}.nav button{flex:1}.muted{color:#a4a9b4}.badge{color:#f2a5a5;font-size:11px}.bar{height:7px;background:#353943;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#9db6e3}.n 'use strict';const stage=document.getElementById('stage'),views={},stack=[];let unlocked=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(id,body,cls='row')=>`<button class="${cls}" data-open="${esc(id)}">${body}</button>`;const card=s=>`<div class="card">${esc(s)}</div>`;const row=(id,icon,title,sub='')=>btn(id,`<span class="icon">${esc(icon)}</span><span>${esc(title)}<small>${esc(sub)}</small></span><span>›</span>`);const app=(id,icon,title)=>btn(id,`<span class="icon">${esc(icon)}</span><span>${esc(title)}</span>`,'app');function page(id,title,html){views[id]={title,html};}function detail(id,title,body){page(id,title,card(body));}function list(id,title,items){page(id,title,items.map((a,i)=>{let key=id+'-'+i;detail(key,a[0],a[1]);return row(key,a[2]||'›',a[0],a[3]||'');}).join(''));}

list('notes','암호화 보안 노트',[['인서 취향 및 주의사항 DB','좋아하는 것: 한식(된장찌개, 갈비찜, 김치볶음밥+반숙), 딸기, 바닐라 아이스크림, 내 품에 코알라처럼 매달리기, 등 토닥여주는 것.\n\n싫어하는 것: 민트초코(치약 맛 난다고 질색함 — 반경 5m 내 접근 금지), 혼자 있는 것, 쓴 약.\n\n특이사항: 배고프면 전투 시 기물 파손율이 42% 상승함. 출동 전후로 반드시 초콜릿이나 사탕 등 당분 보충 필수. 가이딩 후에는 체온이 0.4도가량 올라가므로 미지근한 물 준비할 것. 옷으로 가려지는 부위에 과거의 작은 흉터 자국들이 남아 있음 — 스킨십할 때 그 부위는 더 자주, 더 다정하게 입 맞춰줄 것(그때 주동자였던 동급생 무리들의 집안 사업체는 이미 2년 전에 합법적 해킹과 공매도로 전부 파산 처리 완료. 인서는 몰라도 됨).','▤','상시 업데이트 중']]);list('calendar','캘린더',[['매월 5일','연애 기념일 · 알림 설정','♡'],['2020.12.30 ~ 2021.01.10','핀란드 여행 with 인서 · 일정 전체 블록 / 본부 호출 절대 불가','✈'],['2020.12.31','★내 공주님 스무 번째 생일 축하★','☆']]);page('device','G-Custom Pro',card('Fearless 기술개발실 커스텀 단말기\n매트 블랙 · 고강도 티타늄 합금 프레임\n케이스 없음 · 지문 방지 및 프라이버시 필름\n백재하 직접 개조 칩셋 및 연산 모듈\n홍채: 백재하 / 지문: 인서 / PIN: 1231')+card('배터리: 항상 85% 이상 · 70% 미만 즉시 충전\n저장공간 412GB / 2TB · 인서 관련 약 380GB\n개인 클라우드 무제한')+'<div class="bar"><i style="width:20.6%"></i></div>'+card('방해 금지 및 무음 상시 활성화\n서인서만 벨소리·진동·즉시 팝업 허용\n그 외 연락은 긴급 코드(Code Black 등) 예외'));
function tick(){const d=new Date(),t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('time').textContent=t;const l=document.getElementById('locktime'),date=document.getElementById('date');if(l)l.textContent=t;if(date)date.textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});}function render(id){let v=views[id];if(!v)return;stage.querySelectorAll('.screen').forEach(el=>{el.classList.remove('active');el.setAttribute('aria-hidden','true');});let el=document.getElementById('screen-'+id);if(!el){el=document.createElement('section');el.id='screen-'+id;el.className='screen';el.innerHTML=v.title?`<header><button data-action="back" aria-label="뒤로">‹</button><h2>${esc(v.title)}</h2><button data-action="home" aria-label="홈">⌂</button></header><div class="content">${v.html}</div>`:v.html;stage.append(el);}el.classList.add('active');el.setAttribute('aria-hidden','false');tick();}function openScreen(id){if(!views[id]||(!unlocked&&id!=='lock')||stack.at(-1)===id)return;stack.push(id);render(id);}function goBack(){if(stack.length>1){stack.pop();render(stack.at(-1));}}function goHome(){if(!unlocked)return;stack.splice(0,stack.length,'home');render('home');}function lock(){unlocked=false;stack.splice(0,stack.length,'lock');render('lock');document.getElementById('pin').value='';document.getElementById('error').textContent='홍채 · 지문 · PIN 인증';}function unlock(){if(document.getElementById('pin').value==='1231'){unlocked=true;goHome();}else document.getElementById('error').textContent='PIN이 일치하지 않습니다.';}document.getElementById('phone').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('.screen:not(.active)'))return;if(b.dataset.open)openScreen(b.dataset.open);else ({back:goBack,home:goHome,lock,unlock}[b.dataset.action]||(()=>{}))();});stage.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')unlock();});lock();setInterval(tick,1000);
</script></body></html>
