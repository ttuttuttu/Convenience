'use strict';const stage=document.getElementById('stage'),views={},stack=[];let unlocked=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(id,body,cls='row')=>`<button class="${cls}" data-open="${esc(id)}">${body}</button>`;const card=s=>`<div class="card">${esc(s)}</div>`;const row=(id,icon,title,sub='')=>btn(id,`<span class="icon">${esc(icon)}</span><span>${esc(title)}<small>${esc(sub)}</small></span><span>›</span>`);const app=(id,icon,title)=>btn(id,`<span class="icon">${esc(icon)}</span><span>${esc(title)}</span>`,'app');function page(id,title,html){views[id]={title,html};}function detail(id,title,body){page(id,title,card(body));}function list(id,title,items){page(id,title,items.map((a,i)=>{let key=id+'-'+i;detail(key,a[0],a[1]);return row(key,a[2]||'›',a[0],a[3]||'');}).join(''));}

function tick(){const d=new Date(),t=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('time').textContent=t;const l=document.getElementById('locktime'),date=document.getElementById('date');if(l)l.textContent=t;if(date)date.textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});}function render(id){let v=views[id];if(!v)return;stage.querySelectorAll('.screen').forEach(el=>{el.classList.remove('active');el.setAttribute('aria-hidden','true');});let el=document.getElementById('screen-'+id);if(!el){el=document.createElement('section');el.id='screen-'+id;el.className='screen';el.innerHTML=v.title?`<header><button data-action="back" aria-label="뒤로">‹</button><h2>${esc(v.title)}</h2><button data-action="home" aria-label="홈">⌂</button></header><div class="content">${v.html}</div>`:v.html;stage.append(el);}el.classList.add('active');el.setAttribute('aria-hidden','false');tick();}function openScreen(id){if(!views[id]||(!unlocked&&id!=='lock')||stack.at(-1)===id)return;if((id==='home'||id==='home2')&&(stack.at(-1)==='home'||stack.at(-1)==='home2')){stack[stack.length-1]=id;render(id);return;}stack.push(id);render(id);}function goBack(){if(stack.length>1){stack.pop();render(stack.at(-1));}}function goHome(){if(!unlocked)return;stack.splice(0,stack.length,'home');render('home');}function lock(){unlocked=false;stack.splice(0,stack.length,'lock');render('lock');}function unlock(){unlocked=true;goHome();}document.getElementById('phone').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('.screen:not(.active)'))return;if(b.dataset.open)openScreen(b.dataset.open);else if(b.dataset.toggle){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');b.querySelector('.switch').textContent=b.getAttribute('aria-pressed')==='true'?'ON':'OFF';}else ({back:goBack,home:goHome,lock,unlock}[b.dataset.action]||(()=>{}))();});stage.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')unlock();});lock();setInterval(tick,1000);
