function album(id){const a=albums.find(a=>a[0]===id);let indexes=photos.map((p,i)=>i).filter(i=>id==='recent'||(id==='favorite'?fav.has(i):id==='video'?i===5||i===6:id==='screenshot'?i>=12:p[0]===id));detail(a[1],`<div class="pad"><h2>${esc(a[1])}</h2><p class="muted">${esc(a[2])} · 일부 기록 미리보기</p></div><div class="photogrid">${indexes.map(i=>`<button class="photo" data-photo="${i}"><div class="art ${photos[i][0]}">${photos[i][0]==='cat'?'🐈':photos[i][0]==='flight'?'✈':photos[i][0]==='vinyl'?'◉':'✦'}</div>${fav.has(i)?'<span>♥</span>':''}</button>`).join('')}</div>`)}function photo(i){activePhoto=i;const p=photos[i];detail('사진',`<div class="art photohero ${p[0]}">${p[0]==='cat'?'🐈':p[0]==='flight'?'✈':p[0]==='vinyl'?'◉':'✦'}</div><div class="pad"><b>${esc(p[2])}</b><p class="muted">${esc(p[1])}</p><button class="action" data-action="favorite">${fav.has(i)?'♥ 즐겨찾기 해제':'♡ 즐겨찾기'}</button> ${i===6?'<button class="action" data-action="video">▶ 영상 재생</button>':''}<p class="muted">실제 이미지·영상 파일은 포함되지 않았습니다.</p></div>`)}

document.addEventListener('click',e=>{const t=e.target.closest('button[data-action],button[data-key],button[data-folder],button[data-open],button[data-chat],button[data-call],button[data-note],button[data-album],button[data-photo],button[data-tab],button[data-search],button[data-bookmark],button[data-event],button[data-alarm],button[data-track],button[data-cart],button[data-ig],button[data-info],button[data-generic]');if(!t)return;const d=t.dataset;if(d.action){switch(d.action){case 'unlock':$('pass').classList.add('show');$('passerror').textContent='';break;case 'cancel':$('pass').classList.remove('show');code='';dots();break;case 'back':back();break;case 'home':home();break;case 'send':send();break;case 'profile':detail('한도윤',`<div class="pad">${info('프로필 사진','진유하와 함께 찍은 그림자 사진')}${info('상태 메시지','공란')}</div>`);break;case 'chatinfo':{const c=chats[activeChat];detail('대화방 정보',`<div class="pad">${info('대화방',c.name)}${info('알림',activeChat==='yuha'?'켜짐':'꺼짐')}${c.notice?info('고정 공지',c.notice):''}</div>`);break}case 'favorite':if(fav.has(activePhoto))fav.delete(activePhoto);else fav.add(activePhoto);t.textContent=fav.has(activePhoto)?'♥ 즐겨찾기 해제':'♡ 즐겨찾기';notify('즐겨찾기를 변경했습니다');break;case 'video':notify('실제 영상 파일이 없습니다');break;case 'prev':musicIndex=(musicIndex+tracks.length-1)%tracks.length;app('music');break;case 'next':musicIndex=(musicIndex+1)%tracks.length;app('music');break;case 'play':playing=!playing;app('music');if(playing)notify('음원 없이 재생 상태만 표시됩니다');break;case 'lock':stack=[];show('lock',false);break}return}if(d.key){key(d.key);return}if(d.folder){folder(d.folder);return}if(d.open){app(d.open);return}if(d.chat){chat(d.chat);return}if(d.call!==undefined){const c=calls[+d.call];detail(c[0],`<div class="pad">${info('시간',c[1])}${info('통화',c[2])}${info('기록',c[3])}<button class="action" data-action="call">전화 걸기</button></div>`);return}if(d.note!==undefined){const n=notes[+d.note];detail(n[0],`<div class="note"><h2>${esc(n[0])}</h2>${esc(n[1])}</div>`);return}if(d.album){album(d.album);return}if(d.photo!==undefined){photo(+d.photo);return}if(d.tab!==undefined){const x=tabs[+d.tab];detail('Safari',`<div class="pad">${info(x[0],x[1])}<p class="muted">외부 웹페이지는 연결되지 않습니다.</p></div>`);return}if(d.search!==undefined){showInfo(searches[+d.search]);return}if(d.bookmark!==undefined){showInfo(bookmarks[+d.bookmark]);return}if(d.event!==undefined){const ev=[['유하랑 브런치','7월 27일 · 브런치 데이트'],['여의도 한강 데이트 💜','7월 28일 화요일 · 19:00\n피크닉 대여 세트, 돗자리 두께, 선풍기, 모기 퇴치법 확인'],['다음 주 파리 노선','주은재 부기장과 비행 스케줄 및 기상 확인 · 레이오버 호텔 변경 공지']][+d.event];detail(ev[0],`<div class="pad">${info(ev[0],ev[1])}</div>`);return}if(d.alarm!==undefined){alarms[+d.alarm][2]=!alarms[+d.alarm][2];app('alarms');notify(alarms[+d.alarm][2]?'알람 켜짐':'알람 꺼짐');return}if(d.track!==undefined){musicIndex=+d.track;playing=true;app('music');notify('음원 없이 재생 상태만 표시됩니다');return}if(d.cart!==undefined){const c=cart[+d.cart];detail(c[0],`<div class="pad">${info(c[0],c[1])}<span class="pill">장바구니에 담긴 항목</span></div>`);return}if(d.ig!==undefined){const names=['비행기 날개','찐빵이','턴테이블'],arts=['flight','cat','vinyl'],i=+d.ig;detail('Instagram 게시물',`<div class="art photohero ${arts[i]}">${['✈','🐈','◉'][i]}</div><div class="pad">${info('한도윤',names[i])}</div>`);return}if(d.info){showInfo(d.info);return}if(d.generic!==undefined){const x=genericItems[+d.generic];if(x)showInfo(x[0]);return}});
